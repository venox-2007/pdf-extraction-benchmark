[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-extraction-benchmark"
version = "0.1.0"
description = "Benchmarking toolkit for PDF extraction and OCR tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Your Team" }]
dependencies = [
  "docling>=2.87.0",
  "numpy<2",
  "opendataloader-pdf>=2.4.6",
  "paddleocr==2.7.3",
  "paddlepaddle==2.6.2",
  "pymupdf>=1.24.0",
  "streamlit>=1.36.0",
  "surya-ocr>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdf_extraction_benchmark*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
